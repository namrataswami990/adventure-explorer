
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Adventure Awaits{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header class="site-header">

        <a class="logo" href="{% url 'home' %}">
            <span class="logo-mark">▲</span> ADVENTURE
            <span class="logo-light">AWaits</span>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            ☰
        </button>

        <nav class="nav-links" id="navLinks">

            <a href="{% url 'home' %}">Home</a>

            <a href="{% url 'aboutus' %}">About</a>

            <a href="{% url 'adventures' %}">Adventures</a>

            <a class="nav-cta" href="{% url 'contact' %}">
                Plan a trip <span>↗</span>
            </a>

        </nav>

    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">

        <div>
            <a class="logo footer-logo" href="{% url 'home' %}">
                ▲ ADVENTURE<span class="logo-light">AWaits</span>
            </a>

            <p>Find your wild. Make memories that last.</p>
        </div>

        <p class="copyright">
            © 2026 Adventure Awaits. Practice project.
        </p>

    </footer>

    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
